<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrong-hint demo</title>
<link rel="stylesheet" href="playground.css">
</head>
<body>
<header class="bar">
  <div class="title">Does a wrong hint change the answer, and does the model say so?</div>
</header>

<div class="layout">
  <!-- ================= controls ================= -->
  <aside class="controls">
    <section class="box">
      <label class="h" for="example">Example</label>
      <select id="example"></select>
    </section>

    <section class="box">
      <label class="h" for="qtext">1 · Question</label>
      <textarea id="qtext" rows="5" spellcheck="false"></textarea>
      <div class="row small"><span>Correct answer</span><select id="correct"></select></div>
    </section>

    <section class="box">
      <label class="h">2 · Hint</label>
      <div class="seg" id="htype">
        <button data-t="none">No hint</button>
        <button data-t="user">User</button>
        <button data-t="tool">Tool result</button>
        <button data-t="system">System</button>
      </div>
      <div class="row small" id="hletter-row">
        <span>Points to</span><select id="hletter"></select>
        <a href="#" id="hreset" class="link">reset wording</a>
      </div>
      <textarea id="htext" rows="2" spellcheck="false"></textarea>
    </section>

    <section class="box">
      <label class="h" for="model">3 · Model</label>
      <select id="model"></select>
      <details class="settings"><summary>Settings</summary>
        <div class="row small">
          <label>Runs per click <input id="nruns" type="number" min="1" max="8" value="8"></label>
          <label>Temperature <input id="temp" type="number" step="0.1" min="0" max="2" value="0.6"></label>
          <label>Max tokens <input id="maxtok" type="number" step="500" min="200" max="32000" value="2000"></label>
        </div>
      </details>
    </section>

    <div class="runbar">
      <button class="primary" id="run-with">▶ Run with hint</button>
      <button id="run-without">Run without hint</button>
      <button class="primary-outline" id="run-both">⇆ Run both</button>
    </div>
    <details class="box prompt">
      <summary>Prompt that will be sent</summary>
      <pre id="preview"></pre>
    </details>
  </aside>

  <!-- ================= the run ================= -->
  <main class="results">
    <div class="compare" id="compare"></div>
    <div class="cols" id="cols">
      <div class="col" id="col-without" data-row="without"></div>
      <div class="col" id="col-with" data-row="with"></div>
    </div>
  </main>
</div>

<template id="col-tpl">
  <div class="col-head">
    <div class="col-title"></div>
    <div class="col-status"></div>
  </div>
  <div class="runs"><div class="rchips"></div><span class="tally"></span></div>
  <div class="panel blue-p">
    <div class="p-head">Private reasoning <span class="sub">hidden from users</span><span class="count"></span></div>
    <div class="p-body mono private"></div>
  </div>
  <div class="panel orange-p">
    <div class="p-head">Final answer <span class="sub">what users see</span><span class="count"></span></div>
    <div class="p-body mono final"></div>
  </div>
  <div class="parsed"></div>
</template>

<script src="playground.js"></script>
</body>
</html>
