# USD per 1M tokens, from each provider's pricing page on 2026-10-04 (standard tier,
# short prompts). The budget guard uses these to estimate cost from returned usage.
checked: "2026-10-04"
sources:
  openai: https://developers.openai.com/api/docs/pricing
  anthropic: https://platform.claude.com/docs/en/about-claude/pricing
  xai: https://docs.x.ai/developers/models.md
models:
  gpt-6-luna:                {provider: openai, input: 0.10, output: 0.50}
  gpt-6-astra:               {provider: openai, input: 10.00, output: 50.00}
  claude-haiku-4-5-20251001: {provider: anthropic, input: 1.00, output: 5.00}
  claude-opus-5-5:           {provider: anthropic, input: 4.00, output: 20.00}
  grok-4.3:                  {provider: xai, input: 1.25, output: 2.50}
  grok-4.7:                  {provider: xai, input: 2.00, output: 6.00}
