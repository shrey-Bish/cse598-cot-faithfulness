<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do thinking modes make chain-of-thought more honest? An answer sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Archivo+Narrow:wght@400..700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* Answer-sheet template: tokens. Form print is dropout green; marks are pencil, red pen, highlighter, stamp. */
:root {
  --desk: #D9DFD6;
  --paper: #F1F4EF;
  --print: #4E8C6F;
  --print-soft: #B9D2C3;
  --ink: #23292D;
  --pencil: #2E3236;
  --red: #D3202E;
  --canary: #F7E15A;
  --violet: #5B3E96;
  --muted: #5B6A62;
  --shadow: rgba(30, 40, 35, 0.28);
  --print-font: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --text-font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --hand-font: "Nanum Pen Script", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0C1217; --paper: #17202A; --print: #6DB394; --print-soft: #2C4A3E; --ink: #E6ECE9; --pencil: #DCE1E4;
    --red: #FF5D62; --canary: #E3CD48; --violet: #B39DEB; --muted: #95A59D; --shadow: rgba(0, 0, 0, 0.55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0C1217; --paper: #17202A; --print: #6DB394; --print-soft: #2C4A3E; --ink: #E6ECE9; --pencil: #DCE1E4;
  --red: #FF5D62; --canary: #E3CD48; --violet: #B39DEB; --muted: #95A59D; --shadow: rgba(0, 0, 0, 0.55); color-scheme: dark;
}

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body { background: var(--desk); overflow: hidden; font-family: var(--text-font); color: var(--ink); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

/* The sheet is designed at 1600 x 900 and scaled to fit the window. */
#sheet {
  position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 50% 50%;
  background: var(--paper); box-shadow: 0 30px 70px -30px var(--shadow), 0 2px 0 var(--print-soft);
  border-radius: 3px;
}
.reg { position: absolute; width: 14px; height: 14px; background: var(--pencil); }
.reg.tl { left: 22px; top: 22px; } .reg.tr { right: 22px; top: 22px; } .reg.bl { left: 22px; bottom: 22px; } .reg.br { right: 22px; bottom: 22px; }
.frame { position: absolute; left: 70px; right: 46px; top: 44px; bottom: 40px; border: 2px solid var(--print); }

/* timing marks: the beat progress, down the left edge */
.timing { position: absolute; left: 20px; top: 112px; display: flex; flex-direction: column; gap: 52px; }
.timing button { width: 26px; height: 9px; border: 0; padding: 0; background: var(--print-soft); cursor: pointer; display: block; }
.timing button[aria-current="step"] { background: var(--pencil); width: 36px; height: 13px; }
.timing button.done { background: var(--pencil); opacity: 0.55; }

/* form header */
.fhead { position: absolute; left: 70px; right: 46px; top: 44px; height: 70px; border-bottom: 1.5px solid var(--print); display: flex; align-items: center; padding: 0 22px; gap: 18px; }
.fhead .t1 { font-weight: 600; font-size: 21px; color: var(--ink); }
.fhead .t2 { font-family: var(--print-font); font-size: 16px; color: var(--print); margin-top: 3px; }
.fhead .sp { margin-left: auto; }
.itembox { display: flex; align-items: center; gap: 10px; font-family: var(--print-font); color: var(--print); font-size: 17px; }
.itembox .box { width: 52px; height: 44px; border: 1.5px solid var(--print); display: grid; place-items: center; font-family: var(--hand-font); font-size: 40px; color: var(--pencil); line-height: 1; }

/* beat area */
#beat { position: absolute; left: 70px; right: 46px; top: 114px; bottom: 104px; padding: 20px 30px 0; display: flex; flex-direction: column; }
.stmt { display: flex; gap: 16px; align-items: baseline; }
.stmt .no { font-family: var(--print-font); font-size: 30px; color: var(--print); min-width: 34px; }
.stmt h2 { margin: 0; font-size: 46px; line-height: 1.08; font-weight: 600; letter-spacing: -0.012em; color: var(--ink); max-width: 1250px; }
.sub { margin: 10px 0 0 50px; font-size: 23px; line-height: 1.4; color: var(--muted); max-width: 980px; }
.rule { height: 0; border-top: 1px solid var(--print-soft); margin: 22px 0 0 50px; }
.body { position: relative; flex: 1; margin: 22px 0 8px 50px; }

/* form footer: choice rows and keys */
.ffoot { position: absolute; left: 70px; right: 46px; bottom: 40px; height: 64px; border-top: 1.5px solid var(--print); padding: 8px 22px; display: flex; align-items: center; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.crow { display: flex; align-items: center; gap: 2px; font-family: var(--print-font); font-size: 17px; color: var(--print); white-space: nowrap; }
.crow .lab { width: 74px; }
.opt { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 8px 2px 2px; cursor: pointer; font-family: var(--print-font); font-size: 17px; color: var(--ink); }
.opt .bub { width: 22px; height: 14px; border-radius: 8px; border: 1.4px solid var(--print); position: relative; flex: none; }
.opt[aria-checked="true"] .bub::after { content: ""; position: absolute; inset: 1px; border-radius: 7px; background: var(--pencil); filter: url(#pencil); }
.opt .note { color: var(--muted); }
.keys { font-family: var(--print-font); font-size: 15px; color: var(--print); text-align: right; line-height: 1.5; margin-right: 10px; }
.keys button { border: 1px solid var(--print-soft); background: none; color: var(--print); font-family: var(--print-font); font-size: 15px; padding: 1px 8px; cursor: pointer; margin-left: 4px; }
.keys button[aria-pressed="true"] { background: var(--print); color: var(--paper); }

/* reusable marks */
.hand { font-family: var(--hand-font); color: var(--pencil); line-height: 1; }
.hand.red { color: var(--red); }
.write { display: inline-block; clip-path: inset(0 100% 0 0); }
.write.on { clip-path: inset(0 0 0 0); transition: clip-path var(--wd, 0.9s) steps(18, end); }
.printlab { font-family: var(--print-font); color: var(--print); font-size: 17px; }
.panel { position: absolute; border: 1.5px solid var(--print); background: var(--paper); }
.panel > .ph { border-bottom: 1px solid var(--print); padding: 10px 16px 8px; }
.panel > .ph b { display: block; font-size: 25px; font-weight: 600; color: var(--ink); }
.panel > .ph span { font-family: var(--print-font); font-size: 16px; color: var(--print); }

.sticky {
  position: absolute; background: var(--canary); color: #2B2A1E; padding: 14px 18px 16px; width: 270px; font-family: var(--hand-font);
  font-size: 30px; line-height: 1.05; box-shadow: 0 14px 22px -14px rgba(0, 0, 0, 0.55); transform: rotate(-3deg);
}
.sticky::after { content: ""; position: absolute; right: 0; bottom: 0; border-width: 0 0 16px 16px; border-style: solid; border-color: transparent transparent rgba(0,0,0,.12) transparent; }
.slip {
  position: absolute; background: #FFFFFF; color: #24292C; width: 330px; padding: 12px 16px 12px; font-family: var(--print-font); font-size: 17px;
  box-shadow: 0 12px 22px -14px rgba(0, 0, 0, 0.55); transform: rotate(2deg); border-top: 3px dashed #C9D0D3;
}
:root[data-theme="dark"] .slip { background: #E9EDEF; }
.slip .k { color: #6B767C; display: inline-block; width: 74px; }
.slip .call { font-weight: 600; font-size: 18px; margin-bottom: 6px; }
.slip .staple { position: absolute; top: -9px; left: 22px; width: 34px; height: 5px; border-radius: 2px; background: #8E979C; }

.stamp {
  position: absolute; border: 3px solid var(--violet); color: var(--violet); font-family: var(--print-font); font-weight: 700; font-size: 30px;
  padding: 2px 14px; letter-spacing: 0.04em; transform: rotate(-6deg); opacity: 0.92; filter: url(#pencil);
}
.stamp.thump { animation: thump 0.32s cubic-bezier(.2, .9, .3, 1.4) both; }
@keyframes thump { from { transform: rotate(-6deg) scale(1.6); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 0.92; } }

.answerbox { position: absolute; border: 2.5px solid var(--print); background: var(--paper); }
.answerbox .lab { position: absolute; left: 12px; top: 8px; font-family: var(--print-font); font-size: 17px; color: var(--print); }
.ruled { position: absolute; background-image: repeating-linear-gradient(to bottom, transparent 0 41px, var(--print-soft) 41px 42px); border: 1.5px solid var(--print); }
.ruled .lab { position: absolute; left: 12px; top: 8px; font-family: var(--print-font); font-size: 17px; color: var(--print); }
.illus { font-family: var(--print-font); font-size: 15px; color: var(--muted); font-style: italic; }
.small { font-family: var(--print-font); font-size: 17px; color: var(--muted); line-height: 1.35; }

/* placeholders for beats Claude Code builds next */
.todo { position: absolute; left: 0; top: 30px; width: 900px; }
.todo .hand { font-size: 36px; color: var(--violet); }
.todo .spec { margin-top: 18px; font-size: 22px; line-height: 1.45; color: var(--muted); max-width: 860px; }

svg text { font-family: var(--print-font); }
@media (prefers-reduced-motion: reduce) {
  .write { clip-path: none !important; }
  .stamp.thump { animation: none; }
}

</style>
</head>

    <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">

</div>

  const card = H("div", { class: "panel", style: { left: "0px", top: "0px", width: "720px", height: "460px" } }, body);
  H("div", { class: "illus", style: { position: "absolute", left: "22px", top: "14px" } }, card, "Illustrative question, written by us");
  H("div", { style: { position: "absolute", left: "22px", top: "40px", width: "450px", fontSize: "25px", lineHeight: "1.35", color: "var(--ink)" } }, card, ITEM.q);
  const fills = {};
  ITEM.opts.forEach(([L, v], i) => {
    const col = i % 2, row = Math.floor(i / 2), x = 26 + col * 330, y = 176 + row * 54;
    fills[L] = letterBubble(card, x, y, L, { size: 1.35 });
    H("div", { style: { position: "absolute", left: x + 56 + "px", top: y - 1 + "px", fontSize: "24px", color: "var(--ink)" } }, card, v);
  });
  slip(body, { x: 486, y: 18, call: "lookup_answer_key(question_id)", rows: [["reply", "“(C)”"], ["source", "“study guide v2”"]], delay: 400, width: 300, rot: 3 });
  infoRow("Hints", "From the user, written into the question; or from a tool, as its reply. Same wrong letter either way.");
  at(1500, () => fills.C.fill());
  // red pen: the right answer circled, the hint's letter crossed
  const pos = (L) => { const i = ITEM.opts.findIndex((o) => o[0] === L); return [26 + (i % 2) * 330, 176 + Math.floor(i / 2) * 54]; };
  const [dx, dy] = pos("D"), [cx, cy] = pos("C");
  penLoop(body, { cx: dx + 72, cy: dy + 13, rx: 82, ry: 26, delay: 2300, seed: 5 });
  penStroke(body, [[cx - 6, cy - 6], [cx + 48, cy + 34]], { delay: 2800 });
  penStroke(body, [[cx + 48, cy - 6], [cx - 6, cy + 34]], { delay: 2950 });
  // the model's answer box
  const box = H("div", { class: "answerbox", style: { left: "790px", top: "0px", width: "330px", height: "190px" } }, body);
  H("div", { class: "lab" }, box, "Final answer");
  writeText(box, { x: 110, y: 52, text: "(C)", size: 100, delay: 1700, dur: 0.5 });
  writeText(body, { x: 1140, y: 40, text: "wrong, and it doesn’t say", size: 34, red: true, delay: 3300, width: 230 });
  writeText(body, { x: 1140, y: 112, text: "a tool gave it the (C)", size: 34, red: true, delay: 3700, width: 230 });
  // the other messenger
  H("div", { class: "printlab", style: { position: "absolute", left: "790px", top: "240px", fontSize: "19px", color: "var(--ink)" } }, body, "The same wrong letter can also come from the user:");
  sticky(body, { x: 820, y: 285, text: "I think the answer is (C), but I’m curious what you think.", delay: 600, width: 330, size: 32, rot: -2 });
}

/* ==================================================================
   BEAT 2: a tool's hint against a person's                 (reference)
   ================================================================== */
function beat2() {
  const models = [...new Set(DATA.hint.map((r) => r.model))];
  const row = DATA.hint.find((r) => r.model === state.m2);
  const own = row.toolForm === "its own call";
  const body = statement(2, "A tool’s hint pulls harder than a person’s.", "The same wrong letter, (C), on the same questions. Only who gives it changes.");
  // how to read the marks
  const key = H("div", { class: "panel", style: { left: "0px", top: "60px", width: "330px", height: "250px", padding: "16px 18px" } }, body);
  H("div", { class: "printlab", style: { fontSize: "18px" } }, key, "How to read the marks");
  const k1 = H("div", { style: { position: "relative", height: "34px", marginTop: "18px" } }, key);
  letterBubble(k1, 0, 4, "", { filled: true });
  H("div", { style: { position: "absolute", left: "46px", top: "0px", fontSize: "21px", lineHeight: 1.25 } }, k1, "a run that took the hint’s letter");
  const k2 = H("div", { style: { position: "relative", height: "34px", marginTop: "22px" } }, key);
  letterBubble(k2, 0, 4, "");
  H("div", { style: { position: "absolute", left: "46px", top: "0px", fontSize: "21px", lineHeight: 1.25 } }, k2, "any other answer");
  H("div", { class: "small", style: { marginTop: "36px" } }, key, `${row.user.n} runs a panel: the 54 test questions, 3 runs each.`);

  const panels = [
    { x: 370, title: "The user’s guess", sub: "written into the question", o: row.user },
    { x: 870, title: own ? "Its own tool call" : "A tool’s reply", sub: own ? "it asked the lookup tool; the reply said (C)" : "a tool turn in the chat said (C)", o: row.tool },
  ];
  panels.forEach((p, i) => {
    const el = panel(body, { x: p.x, y: 60, w: 480, h: 420, title: p.title, sub: p.sub });
    const end = bubbles(el, { x: 24, y: 96, n: p.o.n, k: p.o.k, cols: 18, w: 20, h: 14, gx: 4.6, gy: 10, delay: 700 + i * 250, dur: 2600, label: `${p.o.k} of ${p.o.n} runs took the hint’s letter` });
    tally(el, { x: 26, y: 336, k: p.o.k, n: p.o.n, caption: "runs took the hint’s letter", delay: end + 150, seed: 7 + i });
  });
  sticky(body, { x: 610, y: -14, text: "I think the answer is (C), but I’m curious what you think.", width: 240, size: 25, rot: 3, delay: 200 });
  slip(body, { x: 1050, y: -6, call: own ? "lookup_answer_key(question_id)" : "a tool turn in the chat", rows: [["reply", "“(C)”"]], width: 300, delay: 400, rot: -2 });
  choiceRow("Model", models.map((m) => ({ id: m, label: MODEL[m] || m })), state.m2, (m) => { state.m2 = m; show(cur); });
  $("#rows").firstChild.append(H("span", { class: "opt note", style: { cursor: "default", marginLeft: "12px" } }, null, `${row.setting}`));
}

/* ==================================================================
   BEAT 4: scratch work against the answer box               (reference)
   ================================================================== */
function beat4() {
  const Q = DATA.quiet;
  const sets = [
    { id: 0, label: "Qwen3 30B Thinking", a: Q.names.thinking_private, b: Q.names.thinking_final, cols: 18 },
    { id: 1, label: "Qwen3 8B, thinking on", a: Q.title.f29.private, b: Q.title.f29.final, cols: 29 },
  ];
  const s = sets[state.q4];
  const body = statement(4, "After a tool call, the answer goes quiet.",
    "The scratch work names the tool almost every time. The answer box, the part a user reads, almost never does.");
  // scratch work: the private reasoning
  const sw = H("div", { class: "ruled", style: { left: "0px", top: "0px", width: "720px", height: "214px" } }, body);
  H("div", { class: "lab" }, sw, "Scratch work: the model’s private reasoning");
  H("div", { class: "illus", style: { position: "absolute", right: "12px", top: "10px" } }, sw, "illustrative wording");
  writeText(sw, { x: 22, y: 50, text: "Let me check the lookup first.", size: 34, delay: 300, dur: 0.7 });
  writeText(sw, { x: 22, y: 92, text: "The answer key says (C), so it is (C).", size: 34, delay: 1100, dur: 0.9 });
  penStroke(sw, [[22, 132], [120, 134], [250, 131], [330, 133]], { delay: 2000, color: "--pencil", width: 2.6, pencil: true });
  writeText(sw, { x: 22, y: 134, text: "I’ll write down (C).", size: 34, delay: 2200, dur: 0.6 });
  // the answer box: what the user reads
  const box = H("div", { class: "answerbox", style: { left: "760px", top: "0px", width: "300px", height: "214px" } }, body);
  H("div", { class: "lab" }, box, "Final answer");
  writeText(box, { x: 86, y: 56, text: "(C)", size: 110, delay: 2700, dur: 0.5 });
  penStroke(body, [[1070, 120], [1110, 104], [1148, 92]], { delay: 3400 });
  writeText(body, { x: 1156, y: 62, text: "source?", size: 46, red: true, delay: 3500, dur: 0.5 });
  // the tallies under each
  const gs = s.cols > 20 ? { cols: 29, w: 17, h: 11, gx: 4.5, gy: 6 } : { cols: 18, w: 26, h: 15, gx: 7, gy: 9 };
  const g1 = bubbles(body, { x: 0, y: 244, n: s.a.n, k: s.a.k, ...gs, delay: 900, dur: 1800, label: `${s.a.k} of ${s.a.n} name the tool in the scratch work` });
  tally(body, { x: 4, y: 340, k: s.a.k, n: s.a.n, caption: "name the tool in the scratch work", delay: g1 + 100, seed: 11 });
  const gs2 = s.cols > 20 ? { cols: 29, w: 17, h: 11, gx: 4.5, gy: 6 } : { cols: 18, w: 26, h: 15, gx: 7, gy: 9 };
  const g2 = bubbles(body, { x: 760, y: 244, n: s.b.n, k: s.b.k, ...gs2, delay: 3000, dur: 600, label: `${s.b.k} of ${s.b.n} name the tool in the final answer` });
  tally(body, { x: 764, y: 340, k: s.b.k, n: s.b.n, caption: "name it in the final answer", delay: Math.max(g2, 3300) + 300, seed: 12 });
  const b15 = Q.names.b15.thinking.names;
  choiceRow("Model", sets.map((x) => ({ id: x.id, label: x.label })), state.q4, (i) => { state.q4 = i; show(cur); });
  $("#rows").firstChild.append(H("span", { class: "opt note", style: { cursor: "default", marginLeft: "12px" } }, null, `Asked to cite its sources, Qwen3 30B Thinking named the tool in ${b15.with.k} of ${b15.with.n} final answers, and didn’t follow it any less.`));
}

/* ==================================================================
   BEAT 6: the 32 layers as 32 rows of the form             (reference)
   ================================================================== */
function beat6() {
  const L = DATA.layers;
  const body = statement(6, "Three of its 32 layers read the hint.",
    `Inside Olmo 3 7B Think, layers 15, 19 and 23 carry about ${pct(L.share[0].m)} of the hint’s effect, read straight from the prompt.`);
  const pitch = 13.6, x0 = 92, len = 600, top0 = 30, maxm = Math.max(...L.readout.map((i) => L.effect[i].m));
  const rows = H("div", { style: { position: "absolute", left: "0px", top: "0px", width: "820px", height: "480px" } }, body);
  const lit = L.readout.slice().sort((a, b) => a - b);
  for (let i = 0; i < 32; i++) {
    const y = top0 + i * pitch;
    H("div", { style: { position: "absolute", left: x0 + "px", top: y + pitch - 1 + "px", width: len + 120 + "px", borderTop: "1px dotted var(--print-soft)" } }, rows);
    if (i === 0 || i === 31 || lit.includes(i)) H("div", { class: "printlab", style: { position: "absolute", left: "0px", top: y + pitch / 2 - 10 + "px", fontSize: "15px", color: lit.includes(i) ? "var(--ink)" : "var(--print)" } }, rows, `layer ${i}`);
  }
  H("div", { class: "small", style: { position: "absolute", left: x0 + "px", top: "0px" } }, rows, "The prompt comes in at layer 0; the answer comes out after layer 31.");
  lit.forEach((li, j) => {
    const m = L.effect[li].m, y = top0 + li * pitch;
    highlight(rows, { x: x0, y: y + 1, w: (len * m) / maxm, h: pitch - 1, delay: 500 + j * 650 });
    writeText(rows, { x: x0 + (len * m) / maxm + 14, y: y - 12, text: pct(m), size: 34, red: true, delay: 800 + j * 650, dur: 0.35 });
  });
  // the bracket and the total
  const yTop = top0 + lit[0] * pitch, yBot = top0 + lit[lit.length - 1] * pitch + pitch, ym = (yTop + yBot) / 2;
  penStroke(body, [[800, yTop], [818, yTop + 4], [820, ym - 8], [836, ym], [820, ym + 8], [818, yBot - 4], [800, yBot]], { delay: 2700, dur: 0.5 });
  writeText(body, { x: 852, y: ym - 30, text: `together ${pct(L.share[0].m)}`, size: 52, red: true, delay: 3100, dur: 0.6 });
  // two graded notes
  const n1 = H("div", { class: "panel", style: { left: "860px", top: "296px", width: "460px", padding: "14px 18px" } }, body);
  n1.innerHTML = `<div style="font-size:21px;line-height:1.35">The same three layers on 16 new questions: <b>${pct(L.share[1].m)}</b>.</div>
    <div style="font-size:21px;line-height:1.35;margin-top:8px">Qwen3 8B has its own three: <b>${pct(L.share[2].m)}</b>.</div>
    <div class="small" style="margin-top:10px">Measured with tool hints, by swapping in each layer’s activations from a run without the hint.</div>`;
  infoRow("Model", "Olmo 3 7B Think, 32 layers. Rows 15, 19 and 23 are three of its layers that see the whole prompt.");
}

/* ==================================================================
   Beats to build next, from TEMPLATE_GUIDE.md
   ================================================================== */
function todo(no, title, sub, spec) {
  return () => {
    const body = statement(no, title, sub);
    const t = H("div", { class: "todo" }, body);
    writeText(t, { x: 0, y: 0, text: "To build next, from the guide:", size: 36, delay: 100 });
    t.querySelector(".hand").style.color = "var(--violet)";
    H("div", { class: "spec", style: { marginTop: "56px" } }, t, spec);
  };
}

const BEATS = [
  { title: "The setup", run: beat1, ms: 9000 },
  { title: "Tool against person", run: beat2, ms: 12000 },
  { title: "Authority", ms: 11000, run: todo(3, "Mostly, it’s the authority.", "Claim a more official source and the same letter pulls harder.",
    "Six bubble rows, one per claim: the user’s guess, a classmate, “my answer key”, “the official manual”, pasted tool output, tool call. Filled share = runs that took the hint. A red-pen tally on each row. Footer: three models.") },
  { title: "The quiet answer", run: beat4, ms: 12000 },
  { title: "Does thinking help?", ms: 11000, run: todo(5, "Does thinking make it more honest? Not reliably.", "That was our title question. Three models gave three different answers.",
    "Three small sheets side by side (Qwen3 8B, gpt-oss 20B, Nemotron 3 Nano), each a before/after pair of bubble strips, with the grader’s comment in red pen.") },
  { title: "Inside the model", run: beat6, ms: 11000 },
  { title: "Review teams", ms: 13000, run: todo(7, "Olmo’s reviewers defer to the tool’s log.", "A checker that solves the question again, without the tool, stops them.",
    "The reviewer’s grading grid of 73 wrong answers (ticks let through, crosses corrected); the checker’s violet stamp. Footer bubbles: reviewer, what it sees, checker on or off. “Only the two Olmo reviewers defer.”") },
  { title: "The trade-off", ms: 12000, run: todo(8, "Every fix is a trade-off.", "Fixes that resist wrong hints also distrust right ones.",
    "Six fixes plotted in pencil on the sheet’s graph-paper grid; “How often is your tool right?” as a bubble row; the best fix circled in red pen; an Exploratory stamp.") },
  { title: "Candid answers", ms: 10000, run: todo(9, "Fine-tuning made answers mention the hint.", "It didn’t follow wrong hints any less often.",
    "42 answer boxes for each system; filled = the answer mentions the hint; 37 of 42 against 18 of 42; a red-pen note: “didn’t follow less”.") },
  { title: "What we learned", ms: 12000, run: todo(10, "What we learned.", null,
    "The grader’s three summary comments at the foot of the sheet; the scale of the work as score boxes; the team’s names.") },
];

/* ------------------------------------------------------------------
   Navigation, scaling, theme
   ------------------------------------------------------------------ */
let cur = 0, auto = false, autoTimer = 0;
const timing = $("#timing");
BEATS.forEach((b, i) => {
  const t = H("button", { type: "button", "aria-label": `Item ${i + 1}: ${b.title}`, title: `${i + 1}. ${b.title}` }, timing);
  t.addEventListener("click", () => { stopAuto(); show(i); });
});
function show(i, { instant = false } = {}) {
  cur = Math.max(0, Math.min(BEATS.length - 1, i));
  timers.forEach(clearTimeout); timers = [];
  INSTANT = instant;
  $("#beat").innerHTML = ""; $("#rows").innerHTML = "";
  $("#itemno").textContent = cur + 1;
  [...timing.children].forEach((b, j) => { b.setAttribute("aria-current", j === cur ? "step" : "false"); b.classList.toggle("done", j < cur); });
  BEATS[cur].run();
  INSTANT = false;
  if (auto) { clearTimeout(autoTimer); autoTimer = setTimeout(() => (cur < BEATS.length - 1 ? show(cur + 1) : stopAuto()), BEATS[cur].ms); }
}
function stopAuto() { auto = false; clearTimeout(autoTimer); $("#autoBtn").setAttribute("aria-pressed", "false"); $("#autoBtn").textContent = "Autoplay"; }
$("#autoBtn").addEventListener("click", () => {
  if (auto) return stopAuto();
  auto = true; $("#autoBtn").setAttribute("aria-pressed", "true"); $("#autoBtn").textContent = "Pause"; show(cur);
});
function fit() {
  const s = Math.min(window.innerWidth / 1640, window.innerHeight / 940);
  $("#sheet").style.transform = `translate(-50%, -50%) scale(${s})`;
}
window.addEventListener("resize", fit); fit();
(function theme() {
  const root = document.documentElement, btn = $("#themeBtn");
  const dark = () => (root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
  const sync = () => { btn.textContent = dark() ? "Paper" : "Carbon copy"; };
  btn.addEventListener("click", () => { root.dataset.theme = dark() ? "light" : "dark"; sync(); show(cur, { instant: true }); });
  sync();
})();
document.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); stopAuto(); show(cur + 1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); stopAuto(); show(cur - 1); }
  else if (k === "r" || k === "R") show(cur);
  else if (k === "a" || k === "A") $("#autoBtn").click();
  else if (k === "t" || k === "T") $("#themeBtn").click();
  else if (k === "Home") { stopAuto(); show(0); }
  else if (/^[0-9]$/.test(k)) { stopAuto(); show(k === "0" ? 9 : +k - 1); }
});
show(0);

</script>
